# Item 294: what the live page does when the browser takes its WebGL context away, read where a graphics card draws.
# Each job builds the page at one commit on a hosted machine, opens it in the installed Chrome and runs
# tools/lostcontext.mjs of this push on it. The job named lost context takes the context with the WEBGL_lose_context
# extension in eight cases, at two sizes, and reads what stands on the screen, which season mark is lit, what reaches
# the card, whether the page comes back and every line of the console. The job named console opens the page with no
# loss, in two seasons on Windows, until the page says its whole pictures have arrived (ready) or ten minutes have
# passed, and writes every line of the console (item 282: the lines Direct3D writes for a shader).
# The first run (46148923668) read the losses on main's build and on the branch's, on macOS and on Windows. The second
# (46151819966) read the console only, on main's build and on the branch's with item 282's commit. This third run
# reads the branch's last head alone (01929331): the losses on macOS, the console on Windows.
# It starts by hand, and on every push to agent/p6-context-294-ci: the branch is for this reading and is not merged.
# It has no timer and never starts on main. Every job ends green whatever happens: a red run sends a mail. What a job
# read is the step "what was read" of its log and the files of its artifact. It uses no secret and writes nothing to the repo.
name: item 294 lost context

on:
  workflow_dispatch:
  push:
    branches: [agent/p6-context-294-ci]

permissions:
  contents: read

jobs:
  context:
    name: lost context ${{ matrix.tree.name }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # A tree with no head named is the head of the push itself.
        tree:
          - { name: last, head: '0192933119e9737c8db81e48286b3855ca7dd9da', sizes: 'hd,phone' }
    steps:
      - name: the tool of this push
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: _tool
          persist-credentials: false
          sparse-checkout: |
            tools/lostcontext.mjs
          sparse-checkout-cone-mode: false

      - name: the page at the commit to be read
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tree.head || github.sha }}
          path: page
          persist-credentials: false

      - name: install and build
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        working-directory: page
        run: |
          mkdir -p out/work/context
          echo "tree ${{ matrix.tree.name }}, commit $(git rev-parse HEAD), machine ${ImageOS:-} ${ImageVersion:-} $(uname -sm), node $(node --version)" | tee out/work/context/tree.txt
          npm ci --no-audit --no-fund
          npm run build
          echo "built: $(cat dist/build.json)" | tee -a out/work/context/tree.txt

      - name: the losses
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        working-directory: page
        run: |
          cp ../_tool/tools/lostcontext.mjs tools/lostcontext.mjs
          node tools/lostcontext.mjs --dist dist --name "${{ matrix.tree.name }}-${{ runner.os }}" --local --sizes ${{ matrix.tree.sizes }} --limit 240 --ready 240

      - name: what was read
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: page
        run: cat out/work/context/tree.txt out/work/context/*/lines.txt

      - name: the files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: context-${{ matrix.tree.name }}-${{ runner.os }}
          path: page/out/work/context
          if-no-files-found: warn
          retention-days: 14

  console:
    name: console ${{ matrix.tree.name }} windows
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tree:
          - { name: last, head: '0192933119e9737c8db81e48286b3855ca7dd9da' }
    steps:
      - name: the tool of this push
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: _tool
          persist-credentials: false
          sparse-checkout: |
            tools/lostcontext.mjs
          sparse-checkout-cone-mode: false

      - name: the page at the commit to be read
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tree.head || github.sha }}
          path: page
          persist-credentials: false

      - name: install and build
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        working-directory: page
        run: |
          mkdir -p out/work/context
          echo "tree ${{ matrix.tree.name }}, commit $(git rev-parse HEAD), machine ${ImageOS:-} ${ImageVersion:-} $(uname -sm), node $(node --version)" | tee out/work/context/tree.txt
          npm ci --no-audit --no-fund
          npm run build
          echo "built: $(cat dist/build.json)" | tee -a out/work/context/tree.txt

      # A page that is not whole in four minutes or not made in six more is given up by the tool itself: ten minutes a season.
      - name: the console in fall
        continue-on-error: true
        timeout-minutes: 13
        shell: bash
        working-directory: page
        run: |
          cp ../_tool/tools/lostcontext.mjs tools/lostcontext.mjs
          node tools/lostcontext.mjs --dist dist --name "console-${{ matrix.tree.name }}-fall" --local --cases usual --sizes hd --season fall --quality plain --until detail --limit 240 --ready 600

      - name: the console in winter
        continue-on-error: true
        timeout-minutes: 13
        shell: bash
        working-directory: page
        run: |
          cp ../_tool/tools/lostcontext.mjs tools/lostcontext.mjs
          node tools/lostcontext.mjs --dist dist --name "console-${{ matrix.tree.name }}-winter" --local --cases usual --sizes hd --season winter --quality plain --until detail --limit 240 --ready 600

      - name: what was read
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: page
        run: cat out/work/context/tree.txt out/work/context/*/lines.txt

      - name: the files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.tree.name }}-Windows
          path: page/out/work/context
          if-no-files-found: warn
          retention-days: 14
