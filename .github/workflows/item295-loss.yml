# Item 295: why main's page loses its WebGL context in winter on the hosted macOS card, and what that means for real
# Apple machines. A diagnosis: nothing here mends anything, and nothing here is merged.
# Every job builds one page on one hosted machine and opens it in the installed Chrome with tools/item295/listen.mjs,
# which only listens: nothing of a tool is on the card. The page is main, untouched (a3320a30, the same src as the
# 6befeeb0 the trials of item 285 opened), or an older commit of main, or the probe build of this branch, whose only
# change to main's src is switches that turn a part off (src/core/off295.ts names them).
# The arm q5-webkit opens the page in the driver's own build of WebKit (the engine of Safari, not Safari itself); the
# arms named after an image open it in the installed Chrome of another free hosted macOS image.
# The matrix below names the arms of this push (the arms of the pushes before it are in this file's history): the page, the addresses and how many browsers each gets, how long a
# load is left, the browser's own switches, and whether the machine's sampler is begun (never in a listening arm).
# It starts on a push to agent/p6-loss-295 that changes this file, and by hand. It has no timer and never starts on
# main or on another builder's branch. Every job ends green whatever happens: a red run sends a mail. What a job read is
# the step "what was read" of its log and the files of its artifact. It uses no secret and writes nothing to the repo.
name: item 295 the lost card

on:
  push:
    branches: [agent/p6-loss-295]
    paths: ['.github/workflows/item295-loss.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm:
    name: ${{ matrix.arm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tenth push, ordered by root's ruling 331 of 19:23 UTC (one run, four arms, at most four hosted Macs, no other run
          # of this branch beside it). The seventh push kept the card when the canvas was in full sight from the page's
          # first moment. The question of this push: is the card also kept when the canvas is in sight from the first
          # moment at an opacity no eye can see, and the page's own fade then runs at the mark exactly as on main?
          # Four arms of 10 winter loads of main's page at the plain address, each load in a browser begun for it, left
          # 40 s and 5 s after a loss, tools beside the page only, the machine's log kept in every load:
          #   q10-hair: a style of the tool gives the canvas opacity 0.004 while it carries no data-live.
          #   q10-hair-02: the same with 0.02, in case the browser treats 0.004 as nothing.
          #   q10-will-change: the canvas at opacity 0 as on main, plus will-change: opacity on it from the first moment.
          #   q10-main: main as it is, with the listening tool and the machine's log only, the control of this run.
          - { arm: q10-hair, os: macos-latest, page: a3320a306c1df32d86daf8f1ef82cab612d0eacc, loads: '10:', stay: 40, after: 5, spindump: 0, flags: '', more: '--canvas-opacity 0.004 --oslog all' }
          - { arm: q10-hair-02, os: macos-latest, page: a3320a306c1df32d86daf8f1ef82cab612d0eacc, loads: '10:', stay: 40, after: 5, spindump: 0, flags: '', more: '--canvas-opacity 0.02 --oslog all' }
          - { arm: q10-will-change, os: macos-latest, page: a3320a306c1df32d86daf8f1ef82cab612d0eacc, loads: '10:', stay: 40, after: 5, spindump: 0, flags: '', more: '--canvas-will-change --oslog all' }
          - { arm: q10-main, os: macos-latest, page: a3320a306c1df32d86daf8f1ef82cab612d0eacc, loads: '10:', stay: 40, after: 5, spindump: 0, flags: '', more: '--oslog all' }
    steps:
      - name: the tools of this branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: tools-tree
          persist-credentials: false

      - name: the page
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.page }}
          path: page
          persist-credentials: false

      - name: the machine
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tools-tree/out/work/item295
          note="tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          {
            echo "arm ${{ matrix.arm }}, page $(git -C page rev-parse HEAD), tools $(git -C tools-tree rev-parse HEAD), image ${ImageOS:-} ${ImageVersion:-} $(uname -sm), node $(node --version)"
            sw_vers
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize hw.model
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
            system_profiler SPHardwareDataType SPDisplaysDataType 2>/dev/null | grep -v -i -E "serial|uuid|udid"
            echo "--- ioreg, the accelerators"
            ioreg -r -c IOAccelerator -w 0 -d 3 2>/dev/null | head -120
            echo "--- ioreg, lines that name the card"
            ioreg -l -w 0 2>/dev/null | grep -i -E "paravirt|VRAM|gpu-core|MetalPlugin" | head -40
          } > "$note" 2>&1 || true
          head -60 "$note"

      - name: install and build
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          ( cd page && npm ci --no-audit --no-fund && npm run build )
          echo "page built: $(cat page/dist/build.json)" | tee -a "tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          if cmp -s page/package-lock.json tools-tree/package-lock.json; then
            ln -s ../page/node_modules tools-tree/node_modules
          else
            ( cd tools-tree && npm ci --no-audit --no-fund )
          fi

      - name: the driver's WebKit
        if: contains(matrix.more, '--webkit')
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        working-directory: tools-tree
        run: npx playwright-core install webkit

      - name: the loads
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        working-directory: tools-tree
        run: |
          flags="${{ matrix.flags }}"
          more=()
          if [ -n "$flags" ]; then more=(--flags "$flags"); fi
          # matrix.more is words for the tool as they stand (--plain-flags, --viewport 640x360, --scale 2): split on purpose.
          node tools/item295/listen.mjs --dist ../page/dist --name "${{ matrix.arm }}" --local --loads "${{ matrix.loads }}" --stay "${{ matrix.stay }}" --after-loss "${{ matrix.after }}" --spindump "${{ matrix.spindump }}" ${{ matrix.more }} "${more[@]}" || true

      - name: what was read
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: tools-tree
        run: |
          cat "out/work/item295/${{ matrix.arm }}.txt"
          for f in out/work/item295/*-spindump.txt; do [ -f "$f" ] && gzip -9 "$f"; done
          rm -f out/work/item295/*-driver.log
          find out/work/item295 -name '*-chrome.log' -size +2000k -exec gzip -9 {} \;
          du -sh out/work/item295

      - name: the files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arm }}
          path: tools-tree/out/work/item295
          if-no-files-found: warn
          retention-days: 14
