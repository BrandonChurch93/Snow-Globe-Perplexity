# Item 295: why main's page loses its WebGL context in winter on the hosted macOS card, and the hosted proof of the
# one value mend that root ordered in its ruling 334 (the canvas waits at opacity 0.004 and not at 0 before its first
# picture). The mend itself is on the branch agent/p6-hair-295; this branch holds tools only. Nothing here is merged.
# Started by hand only, with two commits as inputs: a (side A, the mend's parent, main as it is) and b (side B, the
# mend's head). It has no timer, starts on no push, and never starts on main or on another builder's branch.
# The jobs pair-1 and pair-2 each take one hosted Mac. Each builds both pages in the job and opens them in the installed
# Chrome with tools/item295/listen.mjs: 20 loads that alternate A and B, A first, each load in a browser begun for it,
# winter at the plain address, left 40 s and 5 s after a loss, the machine's log kept. No rule of the tool is in either
# page: the opacity of the canvas comes from each page's own index.html, and the tool's recorder reads the computed
# opacity in every frame before the first picture, at the events of the fade and at the load's end.
# The jobs b-windows and b-linux open side B alone on a hosted Windows and a hosted Linux machine, 10 loads each, to see
# that the value does no harm there. Those machines have no graphics card of their own: what draws is named in the files.
# Every job ends green whatever happens: a red run sends a mail. What a job read is the step "what was read" of its log
# and the files of its artifact. It uses no secret and writes nothing to the repo.
# The runs before this one (the diagnosis, ten pushes) are in this file's history.
name: item 295 the lost card

on:
  workflow_dispatch:
    inputs:
      a:
        description: "side A: the mend's parent, a commit of main"
        required: true
        type: string
      b:
        description: "side B: the mend's head"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pair:
    name: ${{ matrix.arm }}
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arm: [pair-1, pair-2]
    steps:
      - name: the tools of this branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: tools-tree
          persist-credentials: false

      - name: side A
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.a }}
          path: page-a
          persist-credentials: false

      - name: side B
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.b }}
          path: page-b
          persist-credentials: false

      - name: the machine
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tools-tree/out/work/item295
          note="tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          {
            echo "arm ${{ matrix.arm }}, side A $(git -C page-a rev-parse HEAD), side B $(git -C page-b rev-parse HEAD), tools $(git -C tools-tree rev-parse HEAD), image ${ImageOS:-} ${ImageVersion:-} $(uname -sm), node $(node --version)"
            echo "chip: $(sysctl -n machdep.cpu.brand_string); cores: $(sysctl -n hw.ncpu); memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB; model: $(sysctl -n hw.model)"
            sw_vers
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
            system_profiler SPHardwareDataType SPDisplaysDataType 2>/dev/null | grep -v -i -E "serial|uuid|udid"
            echo "--- ioreg, lines that name the card"
            ioreg -l -w 0 2>/dev/null | grep -i -E "paravirt|VRAM|gpu-core|MetalPlugin" | head -40
          } > "$note" 2>&1 || true
          head -50 "$note"

      - name: install and build both pages
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          note="tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          ( cd page-a && npm ci --no-audit --no-fund && npm run build )
          ( cd page-b && npm ci --no-audit --no-fund && npm run build )
          if cmp -s page-a/package-lock.json tools-tree/package-lock.json; then
            ln -s ../page-a/node_modules tools-tree/node_modules
          else
            ( cd tools-tree && npm ci --no-audit --no-fund )
          fi
          # What follows only tells: nothing in it may end the step.
          set +e
          {
            echo "side A built: $(cat page-a/dist/build.json)"
            echo "side B built: $(cat page-b/dist/build.json)"
            echo "--- the files of the two commits that differ (node_modules and dist left out)"
            diff -rq -x node_modules -x dist -x .git page-a page-b
            echo "--- index.html, A against B"
            diff page-a/index.html page-b/index.html
            echo "--- the files of the two built pages that differ"
            diff -rq page-a/dist page-b/dist
            echo "--- the rule of the canvas in each built page"
            echo "A: $(grep -o '#view[^}]*}' page-a/dist/index.html | tr '\n' ' ')"
            echo "B: $(grep -o '#view[^}]*}' page-b/dist/index.html | tr '\n' ' ')"
          } 2>&1 | tee -a "$note"
          true

      - name: the loads
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        working-directory: tools-tree
        run: |
          node tools/item295/listen.mjs --dist ../page-a/dist --dist-b ../page-b/dist --name "${{ matrix.arm }}" --local --loads "20:" --stay 40 --after-loss 5 --spindump 0 --oslog all --watch-canvas || echo "the tool ended badly: $?"

      - name: what was read
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: tools-tree
        run: |
          cat "out/work/item295/${{ matrix.arm }}.txt" || true
          rm -f out/work/item295/*-driver.log
          find out/work/item295 -name '*-chrome.log' -size +2000k -exec gzip -9 {} \;
          du -sh out/work/item295

      - name: the files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arm }}
          path: tools-tree/out/work/item295
          if-no-files-found: warn
          retention-days: 14

  elsewhere:
    name: ${{ matrix.arm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The switches for these machines: Linux has no window of its own, so the tool is begun under xvfb-run there,
          # and the browser is allowed to draw WebGL without a graphics card (its own switch, named in the table).
          - { arm: b-windows, os: windows-latest, under: '' }
          - { arm: b-linux, os: ubuntu-latest, under: 'xvfb-run -a' }
    steps:
      - name: the tools of this branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: tools-tree
          persist-credentials: false

      - name: side B
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.b }}
          path: page-b
          persist-credentials: false

      - name: the machine
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p tools-tree/out/work/item295
          note="tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          {
            echo "arm ${{ matrix.arm }}, side B $(git -C page-b rev-parse HEAD), tools $(git -C tools-tree rev-parse HEAD), image ${ImageOS:-} ${ImageVersion:-} $(uname -sm), node $(node --version)"
            node -e "const os=require('os');console.log('chip: '+os.cpus()[0].model+'; cores: '+os.cpus().length+'; memory: '+Math.round(os.totalmem()/1073741824)+' GB; system: '+os.platform()+' '+os.release())"
          } > "$note" 2>&1 || true
          cat "$note"

      - name: install and build the page
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          note="tools-tree/out/work/item295/${{ matrix.arm }}-machine.txt"
          ( cd page-b && npm ci --no-audit --no-fund && npm run build )
          ( cd tools-tree && npm ci --no-audit --no-fund )
          # What follows only tells: nothing in it may end the step.
          set +e
          {
            echo "side B built: $(cat page-b/dist/build.json)"
            echo "B: $(grep -o '#view[^}]*}' page-b/dist/index.html | tr '\n' ' ')"
          } 2>&1 | tee -a "$note"
          true

      - name: the loads
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        working-directory: tools-tree
        run: |
          ${{ matrix.under }} node tools/item295/listen.mjs --dist ../page-b/dist --name "${{ matrix.arm }}" --local --loads "10:" --stay 40 --after-loss 5 --spindump 0 --oslog none --watch-canvas --flags "--enable-unsafe-swiftshader" || echo "the tool ended badly: $?"

      - name: what was read
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: tools-tree
        run: |
          cat "out/work/item295/${{ matrix.arm }}.txt" || true
          rm -f out/work/item295/*-driver.log
          find out/work/item295 -name '*-chrome.log' -size +2000k -exec gzip -9 {} \;
          du -sh out/work/item295

      - name: the files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arm }}
          path: tools-tree/out/work/item295
          if-no-files-found: warn
          retention-days: 14
