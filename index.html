          return img
        }

        // The few bytes of a still that come with the page: the same picture out of focus, there from the first paint until
        // the still has arrived. `T.p` says which still each was made from, its size and the rim of repeated pixels around it.
        function soft(layer) {
          var data = T.p && T.b && T.b[season] && T.b[season][layer.still[6]]
          if (!data) return
          var img = document.createElement('img')
          img.alt = ''
          img.draggable = false
          img.src = 'data:image/webp;base64,' + data
          layer.soft = img
          layer.el.appendChild(img)
          layer.softly = function () {
            window.setTimeout(function () {
              if (layer.soft && layer.soft.parentNode) layer.soft.parentNode.removeChild(layer.soft)
              layer.soft = null
            }, 400)
          }
        }

        function put(img, b) {
          img.style.left = b.x + 'px'
          img.style.top = b.y + 'px'
          img.style.width = b.w + 'px'
          img.style.height = b.h + 'px'
        }

        function lay(layer, w, h, g) {
          var b = boxOf(layer.still, g)
          put(layer.over, b)
          if (layer.soft) {
            var p = T.p[layer.still[6]]
            var pb = boxOf(T.stills[p[0]], g)
            var kx = pb.w / p[1]
            var ky = pb.h / p[2]
            put(layer.soft, { x: pb.x - p[3] * kx, y: pb.y - p[3] * ky, w: pb.w + 2 * p[3] * kx, h: pb.h + 2 * p[3] * ky })
            layer.soft.style.filter = 'blur(' + Math.max(kx, ky) + 'px)'
          }
          // Where the still does not reach an edge of the screen, a copy of it lies under it, drawn larger about the glass until it
          // does, and the still thins out into the copy toward that edge.
          var bare = [b.y, w - b.x - b.w, h - b.y - b.h, b.x]
          var to = ['bottom', 'left', 'top', 'right']
          var masks = []
          for (var i = 0; i < 4; i++) {
            if (bare[i] <= 0.5) continue
            var soft = Math.round(Math.max(12, Math.min(0.06 * Math.max(b.w, b.h), 3 * bare[i])))
            masks.push('linear-gradient(to ' + to[i] + ', transparent, #000 ' + soft + 'px)')
          }
          var mask = masks.join(',')
          layer.over.style.webkitMaskImage = layer.over.style.maskImage = mask
          layer.over.style.webkitMaskComposite = mask ? 'source-in' : ''
          layer.over.style.maskComposite = mask ? 'intersect' : ''
          if (layer.under) layer.under.style.display = mask ? '' : 'none'
          if (!mask) return
          if (!layer.under) {
            layer.under = picture(layer.still, layer.el, layer.softly)
            layer.el.insertBefore(layer.under.parentNode, layer.over.parentNode)
          }
          var k = Math.max(1, g.cx / (g.cx - b.x), (w - g.cx) / (b.x + b.w - g.cx), g.cy / (g.cy - b.y), (h - g.cy) / (b.y + b.h - g.cy))
          put(layer.under, { x: g.cx - (g.cx - b.x) * k, y: g.cy - (g.cy - b.y) * k, w: b.w * k, h: b.h * k })
        }

        // A screen that changes shape may be better served by another still: the one in place stays until the other has arrived.
        function place(globe, again) {
          if (globe) exact = globe
          var w = box.clientWidth || window.innerWidth
          var h = box.clientHeight || window.innerHeight
          var g = exact || guess(w, h)
          var last = layers[layers.length - 1]
          var s = last && !again ? last.still : choose(w, h, g)
          if (!s) return
          if (!last || last.still !== s) {
            var layer = { still: s, el: document.createElement('div'), under: null, over: null, soft: null, softly: null }
            if (!last) soft(layer)
            layer.over = picture(s, layer.el, layer.softly)
            layer.over.addEventListener('load', function () {
              if (layers.indexOf(layer) < 0) return
              while (layers[0] !== layer) box.removeChild(layers.shift().el)
            })
            layers.push(layer)
            box.appendChild(layer.el)
          }
          for (var i = 0; i < layers.length; i++) lay(layers[i], w, h, g)
        }

        function resized() {
          exact = null
          place(null, true)
        }

        window.firstStill = {
          place: place,
          end: function () {
            window.removeEventListener('resize', resized)
            layers = []
            box.textContent = ''
            delete window.firstStill
          },
        }
        window.addEventListener('resize', resized)
        place(null, true)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
