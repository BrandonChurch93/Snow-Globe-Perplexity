        if (mode === 'capture' && (['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) < 0 || (asked.has('format') && ['uhd', 'hd', 'preview', 'phone', 'tablet'].indexOf(asked.get('format')) < 0))) mode = 'live'
        if (!T || !box || ['autopilot', 'loop', 'capture'].indexOf(mode) >= 0) return
        var season = T.seasons.indexOf(asked.get('season')) < 0 ? T.season : asked.get('season')
        var SCALE = 1e5
        var layers = []
        var exact = null

        function between(axis, v) {
          var n = axis.length - 1
          if (v <= axis[0]) return [0, 0]
          if (v >= axis[n]) return [n - 1, 1]
          var i = 0
          while (axis[i + 1] < v) i++
          return [i, (v - axis[i]) / (axis[i + 1] - axis[i])]
        }

        // How high the controls will stand on this screen. The tool asked the app on every kind of screen the interface's media
        // rules tell apart: `T.c.q` are those rules and `T.c.m` holds, for each way they hold together, the height and the safe
        // area under the page from which the controls rise with it. Rules that hold together in a way the tool did not meet
        // take the nearest it met. A build with no interface has the bar the app takes where it measures none.
        function controls(h) {
          var C = T.c
          if (!C || !window.matchMedia) return Math.min(Math.max(T.e[0] * h, T.e[1]), T.e[2] * h)
          var bits = ''
          for (var i = 0; i < C.q.length; i++) bits += window.matchMedia(C.q[i]).matches ? '1' : '0'
          var hit = C.m[bits]
          var least = Infinity
          if (!hit) {
            for (var key in C.m) {
              var off = 0
              for (i = 0; i < key.length; i++) if (key.charAt(i) !== bits.charAt(i)) off++
              if (off < least) {
                least = off
                hit = C.m[key]
              }
            }
          }
          var probe = document.createElement('div')
          probe.style.cssText = 'position:absolute;visibility:hidden;width:0;height:env(safe-area-inset-bottom,0px)'
          box.appendChild(probe)
          var inset = probe.getBoundingClientRect().height || 0
          box.removeChild(probe)
          return hit[0] + Math.max(0, inset - hit[1])
        }

        // A row of the table is the glass on screens of one aspect, [share, centre, radius, ...]: the shares of the height the
        // controls stand high at which its line bends. It is read along the straight lines between them.
        function row(g, u) {
          var n = g.length - 3
          var j = 0
          if (u <= g[0]) return [g[1], g[2]]
          if (u >= g[n]) return [g[n + 1], g[n + 2]]
          while (g[j + 3] < u) j += 3
          var t = (u - g[j]) / (g[j + 3] - g[j])
          return [g[j + 1] + (g[j + 4] - g[j + 1]) * t, g[j + 2] + (g[j + 5] - g[j + 2]) * t]
        }

        // Where the app draws the glass on a screen of this shape over controls of that height, read from the table: where the
        // globe stays once the app has measured its controls. The app says it exactly once it runs.
        function guess(w, h) {
          var a = between(T.a, w / h)
          var u = controls(h) / h
          var low = row(T.g[a[0]], u)
          var high = row(T.g[a[0] + 1], u)
          return { cx: w / 2, cy: ((low[0] + (high[0] - low[0]) * a[1]) / SCALE) * h, r: ((low[1] + (high[1] - low[1]) * a[1]) / SCALE) * h }
        }

        // A still is [name, width, height, centre, radius, version, soft, foot]: the screen it was drawn for, and on it the glass
        // and the row the globe's foot ends at, as shares of that screen's height. Laid so that its glass is the screen's glass,
        // it takes this box.
        function boxOf(s, g) {
          var k = (g.r * SCALE) / (s[4] * s[2])
          return { x: g.cx - (s[1] * k) / 2, y: g.cy - (s[3] * s[2] * k) / SCALE, w: s[1] * k, h: s[2] * k }
        }

        // The still drawn from the camera nearest to this screen's, that leaves the least of the screen bare and, of two that
        // fill it, the one drawn for the shape nearest to it: the light dims toward the edges of the screen it was drawn for.
        function choose(w, h, g) {
          var best = null
          var least = Infinity
          for (var i = 0; i < T.stills.length; i++) {
            var s = T.stills[i]
            var b = boxOf(s, g)
            var seen = Math.max(0, Math.min(w, b.x + b.w) - Math.max(0, b.x)) * Math.max(0, Math.min(h, b.y + b.h) - Math.max(0, b.y))
            var off = Math.abs(Math.log((g.r * SCALE) / (h * s[4]))) + 3 * Math.abs(g.cy / h - s[3] / SCALE) + 2 * (1 - seen / (w * h)) + 0.25 * (1 - seen / (b.w * b.h))
            if (off < least) {
              least = off
              best = s
            }
          }
          return best
        }

        // A picture that comes in over what the page shows of it already does so softly, once it can be painted whole.
        function picture(s, into, softly) {
          var img = document.createElement('img')
          var pic = document.createElement('picture')
          var source = document.createElement('source')
          var file = 'first/' + season + '-' + s[0]
          img.alt = ''
          img.decoding = 'async'
          img.draggable = false
          img.setAttribute('fetchpriority', 'high')
          source.type = 'image/avif'
          source.srcset = file + '.avif?v=' + s[5]
          pic.appendChild(source)
          pic.appendChild(img)
          into.appendChild(pic)
          img.src = file + '.webp?v=' + s[5]
          if (softly) {
            var show = function () {
              img.style.opacity = '1'
              softly()
            }
            var loaded = function () {
              if (img.complete) show()
              else img.addEventListener('load', show)
            }
            img.style.opacity = '0'
            img.style.transition = 'opacity 0.3s ease'
            if (img.decode) img.decode().then(show, loaded)
            else loaded()
          }
          return img
        }

        // The few bytes of a still that come with the page: the same picture out of focus, there from the first paint until
        // the still has arrived. `T.p` says which still each was made from, its size and the rim of repeated pixels around it.
        function soft(layer) {
          var data = T.p && T.b && T.b[season] && T.b[season][layer.still[6]]
          if (!data) return
          var img = document.createElement('img')
          img.alt = ''
          img.draggable = false
          img.src = 'data:image/webp;base64,' + data
          layer.soft = img
          layer.el.appendChild(img)
          layer.softly = function () {
            window.setTimeout(function () {
              if (layer.soft && layer.soft.parentNode) layer.soft.parentNode.removeChild(layer.soft)
              layer.soft = null
            }, 400)
          }
        }

        // A browser lays a box on whole pixels and draws a box that is moved where it is moved to. A picture whose place is on
        // whole pixels is laid there and drawn pixel for pixel. Any other is laid in the corner, in a box whole in the pixels of
        // the page and of the screen, and moved and sized from there: it stands between two pixels where its place is, as the
        // live picture does that comes in over it. Moved by half a pixel, a picture drawn at half its file's size would be the
        // browser's own halved copy, smeared over two pixels. With a layer of its own and a hair more than half, the browser
        // halves the file itself where the picture stands.
        //
        // Until the app has said where the glass is, a place is read from the table, which is kept only near the app: a still
        // that the screen shows at half or the whole of its file is read a little beside its file's pixels, and soft. Read
        // within `LOOSE` of the size it was drawn for, on a screen as high as that, it is put at that size from the top, where
        // the app's word then leaves it, and whole where it then reaches both sides. `LOOSE` is more than the table is off on
        // any such screen and less than one pixel across the narrowest still: on a screen one pixel narrower or wider than a
        // still the table is right, and the glass is that much smaller or larger.
        var NEAR = 0.1
        var HAIR = 1e-5
        var LOOSE = 0.0022
        function put(img, b) {
          var d = window.devicePixelRatio || 1
          for (var i = 0; !exact && i < layers.length; i++) {
            var s = layers[i].still
            var k = (2 * d * s[1]) / img.naturalWidth
            var own = layers[i].over === img && (k === 1 || k === 2) && k * img.naturalHeight === 2 * d * s[2]
            var off = Math.max(Math.abs(b.w / s[1] - 1), Math.abs(b.h / s[2] - 1), Math.abs(b.y) / s[2])
            if (own && s[2] === (box.clientHeight || window.innerHeight) && off < LOOSE) {
              b = { x: b.x + (b.w - s[1]) / 2, y: 0, w: s[1], h: s[2] }
              if (Math.max(b.x, (box.clientWidth || window.innerWidth) - b.x - b.w) * d < NEAR) img.style.webkitMaskImage = img.style.maskImage = ''
            }
          }
          var far = function (n) {
            var e = [b.x, b.y, b.x + b.w, b.y + b.h]
            var most = 0
            for (var i = 0; i < 4; i++) most = Math.max(most, Math.abs(e[i] * d * n - Math.round(e[i] * d * n)) / n)
            return most
          }
          var both = function (v) {
            var n = Math.round(v) || 1
            for (var i = 0; i < 100; i++) if (Math.abs((n + i) * d - Math.round((n + i) * d)) < 1e-3) return n + i
            return n
          }
          var whole = far(1) < NEAR
          var W = (img.naturalWidth / 2 / d) * (1 + HAIR)
          var H = (img.naturalHeight / 2 / d) * (1 + HAIR)
          var halved = !whole && !img.style.maskImage && far(2) < NEAR && Math.max(Math.abs(b.w - W), Math.abs(b.h - H)) * d < NEAR
          var to = halved ? { x: b.x + (b.w - W) / 2, y: b.y + (b.h - H) / 2, w: W, h: H } : b
          var w = whole ? b.w : both(b.w)
          var h = whole ? b.h : both(b.h)
          img.style.left = (whole ? b.x : 0) + 'px'
          img.style.top = (whole ? b.y : 0) + 'px'
          img.style.width = w + 'px'
          img.style.height = h + 'px'
          img.style.transformOrigin = '0 0'
          img.style.transform = whole ? '' : 'matrix(' + [to.w / w, 0, 0, to.h / h, to.x, to.y].join(',') + ')'
          img.style.willChange = halved ? 'transform' : ''
          var again = function () {
            put(img, img.laid)
          }
          if (!img.naturalWidth && !img.laid) img.addEventListener('load', again, { once: true })
          img.laid = b
        }

        // Where the still does not reach an edge of the screen, copies of it lie under it, each drawn larger about the glass than
        // the one over it, until the last reaches every edge. A picture thins out toward an edge it does not reach, and the copy
        // under it is only so much larger that its globe stays behind the part that does not thin out: a copy shows the room,
        // never a second glass or foot. `D` is how far the still reaches from the middle of the glass toward the top, the right,
        // the bottom and the left, `S` how far the screen does, `G` how far the globe does. The fewest copies are taken that leave
        // every picture its whole part to thin out in; where `MOST` of those do not reach, all parts are cut by one share.
        var MOST = 4
        var SOFT = 0.06
        var RIM = 1.02
        var TO = ['bottom', 'left', 'top', 'right']

        function copies(D, S, G, wide) {
          var most = 1
          var open = false
          for (var e = 0; e < 4; e++) {
            most = Math.max(most, S[e] / D[e])
            if (S[e] - D[e] > 1e-6) open = true
          }
          if (!open) return []
          var plan = function (share) {
            var ks = []
            for (var k = 1; k < most && ks.length < MOST; ks.push(k)) {
              var far = most
              for (var e = 0; e < 4; e++) {
                var bare = S[e] - k * D[e]
                if (bare > 0) far = Math.min(far, (k * D[e] - share * Math.min(wide, 3 * bare)) / G[e])
              }
              k = Math.max(far, k)
            }
            return ks
          }
          var ks = plan(1)
          if (ks[ks.length - 1] < most) {
            var lo = 0
            var hi = 1
            for (var i = 0; i < 12; i++) {
              var mid = (lo + hi) / 2
              var p = plan(mid)
              if (p[p.length - 1] < most) hi = mid
              else lo = mid
            }
            ks = plan(lo)
            ks[ks.length - 1] = most
          }
          return ks
        }

        function lay(layer, w, h, g) {
          var s = layer.still
          var b = boxOf(s, g)
          if (layer.soft) {
            var p = T.p[s[6]]
            var pb = boxOf(T.stills[p[0]], g)
            var kx = pb.w / p[1]
            var ky = pb.h / p[2]
            put(layer.soft, { x: pb.x - p[3] * kx, y: pb.y - p[3] * ky, w: pb.w + 2 * p[3] * kx, h: pb.h + 2 * p[3] * ky })
            layer.soft.style.filter = 'blur(' + Math.max(kx, ky) + 'px)'
          }
          var rim = RIM * g.r
          var D = [g.cy - b.y, b.x + b.w - g.cx, b.y + b.h - g.cy, g.cx - b.x]
          var S = [g.cy, w - g.cx, h - g.cy, g.cx]
          var G = [rim, rim, ((s[7] - s[3]) * b.h) / SCALE, rim]
          var wide = SOFT * Math.max(b.w, b.h)
          var ks = copies(D, S, G, wide)
          while (layer.under.length > ks.length) layer.el.removeChild(layer.under.pop().parentNode)
          while (layer.under.length < ks.length) {
            var copy = picture(s, layer.el, layer.softly)
            layer.el.insertBefore(copy.parentNode, (layer.under[layer.under.length - 1] || layer.over).parentNode)
            layer.under.push(copy)
          }
          for (var j = 0; j <= ks.length; j++) {
            var k = j ? ks[j - 1] : 1
            var img = j ? layer.under[j - 1] : layer.over
            var masks = []
            for (var e = 0; j < ks.length && e < 4; e++) {
              var bare = S[e] - k * D[e]
              var zone = Math.floor(Math.min(wide, 3 * bare, k * D[e] - ks[j] * G[e]))
              if (bare > 0 && zone > 0) masks.push('linear-gradient(to ' + TO[e] + ', transparent, #000 ' + zone + 'px)')
            }
            var mask = masks.join(',')
            img.style.webkitMaskImage = img.style.maskImage = mask
            img.style.webkitMaskComposite = mask ? 'source-in' : ''
            img.style.maskComposite = mask ? 'intersect' : ''
            put(img, j ? { x: g.cx - D[3] * k, y: g.cy - D[0] * k, w: b.w * k, h: b.h * k } : b)
          }
        }

        // A screen that changes shape may be better served by another still: the one in place stays until the other has arrived.
        function place(globe, again) {
          if (globe) exact = globe
          var w = box.clientWidth || window.innerWidth
          var h = box.clientHeight || window.innerHeight
          var g = exact || guess(w, h)
          var last = layers[layers.length - 1]
          var s = last && !again ? last.still : choose(w, h, g)
          if (!s) return
          if (!last || last.still !== s) {
            var layer = { still: s, el: document.createElement('div'), under: [], over: null, soft: null, softly: null }
            if (!last) soft(layer)
            layer.over = picture(s, layer.el, layer.softly)
            layer.over.addEventListener('load', function () {
              if (layers.indexOf(layer) < 0) return
              while (layers[0] !== layer) box.removeChild(layers.shift().el)
            })
            layers.push(layer)
            box.appendChild(layer.el)
          }
          for (var i = 0; i < layers.length; i++) lay(layers[i], w, h, g)
        }

        function resized() {
          exact = null
          place(null, true)
        }

        var first = {
          place: place,
          end: function () {
            window.removeEventListener('resize', resized)
            layers = []
            box.textContent = ''
            delete window.firstStill
          },
        }
        // A page whose picture is gone (src/app/lost.ts) asks for the still of a season, laid as the first was.
        window.stillOf = function (name) {
          first.end()
          if (T.seasons.indexOf(name) >= 0) season = name
          exact = null
          window.firstStill = first
          window.addEventListener('resize', resized)
          place(null, true)
          // It stands sharp the moment it can be painted. A fade keeps the time of the page's frames and the soft picture goes
          // by the wall: where frames are few it would go from under a still that had hardly come.
          var top = layers[layers.length - 1]
          if (top) top.over.style.transition = 'none'
        }
        window.firstStill = first
        window.addEventListener('resize', resized)
        place(null, true)
      })()
    </script>
    <i id="first-laid" hidden></i>
    <script type="module" src="/src/main.ts"></script>
  </body>
