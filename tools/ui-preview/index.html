<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Interface preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07080a;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #view,
      #view i {
        position: absolute;
        inset: 0;
        display: block;
      }
      #view i {
        background-repeat: no-repeat;
        background-position: center;
      }
      #view .far {
        inset: -8%;
        background-size: cover;
        filter: blur(34px) brightness(0.82);
      }
      #view .near {
        background-size: auto 100vmin;
      }
      @media (max-aspect-ratio: 1/1) {
        #view .near {
          -webkit-mask-image: linear-gradient(to bottom, transparent calc(50% - 50vw), #000 calc(50% - 38vw), #000 calc(50% + 40vw), transparent calc(50% + 50vw));
          mask-image: linear-gradient(to bottom, transparent calc(50% - 50vw), #000 calc(50% - 38vw), #000 calc(50% + 40vw), transparent calc(50% + 50vw));
        }
      }
      @media (min-aspect-ratio: 16/9) {
        #view .near {
          -webkit-mask-image: linear-gradient(to right, transparent calc(50% - 88.9vh), #000 calc(50% - 70vh), #000 calc(50% + 70vh), transparent calc(50% + 88.9vh));
          mask-image: linear-gradient(to right, transparent calc(50% - 88.9vh), #000 calc(50% - 70vh), #000 calc(50% + 70vh), transparent calc(50% + 88.9vh));
        }
      }
      #view.blank i {
        display: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="view"><i class="far"></i><i class="near"></i></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
